# SPDX-License-Identifier: MIT
# Rung 3's real app (wisp-fw:boot-test): native-1's configuration with the UART1 console back, so
# rung3.py can follow the app by its banner and heartbeats. Not a hardware image (the gate of
# cmake/hwimage.cmake forbids a console there); everything Wisp Boot sees of the app (its
# watchdog feeds, PMIC writes, the case UART, the hand-off) is native-1's.
CONFIG_WISP_HW_IMAGE=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_WISP_HEARTBEAT_MS=1000
