# TEST ONLY: Bluetooth on *and* the Wisp switches set, but on the unpatched fork. The
# configure gate lets this through; the post-build gate must still reject it, because the
# fork's apollox_blue.c never sets skip_fw_update and the EM9305 image gets linked.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_WISP_BT_ALLOWED=y
CONFIG_WISP_EM9305_SKIP_FW_UPDATE=y
# newlib from gcc-arm-embedded brings init_array constructors once mbedTLS is linked.
CONFIG_STATIC_INIT_GNU=y
