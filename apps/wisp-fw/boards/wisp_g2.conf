# wisp_g2 additions to prj.conf.

# newlib from gcc-arm-embedded brings init_array constructors.
CONFIG_STATIC_INIT_GNU=y

# zlib CRC-32 (crc32_ieee) for Wisp Boot's status block (src/boot_link.c).
CONFIG_CRC=y
# sys_reboot() for the case-UART reset command (src/case/wisp_case.c).
CONFIG_REBOOT=y
