# --- Bluetooth: a peripheral with the Wisp GATT service (src/ble/, README "Bluetooth") -------
# On wisp_g2 the EM9305 driver is Wisp's patched one (third_party/ambiq/patches/): no update,
# recovery or trim path exists in the image (safety rule 8, proven by check_rule8.py).
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_WISP_BT_ALLOWED=y
CONFIG_BT_DEVICE_NAME="Wisp"
CONFIG_BT_MAX_CONN=1

# ATT MTU 247 over 251-byte link-layer packets (protocol.md asks for 247): one notification
# carries 244 bytes of the stream. Data length and 2M PHY are negotiated automatically when
# both sides support them (less radio time per byte).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_ATT_TX_COUNT=4

# Connection parameters the glasses ask for 5 s after connecting (the phone decides): 30–50 ms
# interval like stock's 30 ms, no peripheral latency (a phone write waits at most one
# interval), 4 s supervision timeout. The protocol's LINK_PROFILE op will switch these later.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Logs through printk, without a log thread.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# wisp-core is C11.
CONFIG_STD_C11=y

# Drivers: everything starts suspended and is resumed by the HAL on demand (README W9).
# System PM (deep sleep) stays off until Renode or hardware can show it working.
CONFIG_PM=n
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_CHARGER=y
CONFIG_WATCHDOG=y
CONFIG_MFD=y
CONFIG_MSPI=y
CONFIG_MSPI_AMBIQ_CONTROLLER=y
# bt_enable() runs the controller bring-up on the calling thread (main): the EM9305 driver
# keeps a 258-byte HCI buffer on the stack. 1 KiB overflowed it (found in Renode).
CONFIG_MAIN_STACK_SIZE=2048
