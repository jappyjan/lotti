# Wisp native, milestone M0: boot, banner, heartbeat. Nothing else.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y

# Safety rule 8: no Bluetooth (the build check also fails if any EM9305 code is linked).
CONFIG_BT=n

# Power management comes with the drivers (Renode has no PM models yet).
CONFIG_PM=n
CONFIG_PM_DEVICE=n
