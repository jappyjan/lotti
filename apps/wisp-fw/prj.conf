# Wisp native, milestone M0: boot, banner, heartbeat. Nothing else.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y

# Safety rule 8: no Bluetooth (the build check also fails if any EM9305 code is linked).
CONFIG_BT=n

# Drivers: everything starts suspended and is resumed by the HAL on demand (README W9).
# System PM (deep sleep) stays off until Renode or hardware can show it working.
CONFIG_PM=n
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_I2C=y
# Wisp's copy of the Ambiq I2C driver (third_party/zephyr/README.md: header byte order).
CONFIG_I2C_AMBIQ=n
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_CHARGER=y
CONFIG_WATCHDOG=y
CONFIG_MFD=y
CONFIG_MSPI=y
CONFIG_MSPI_AMBIQ_CONTROLLER=y
