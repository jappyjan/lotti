# SPDX-License-Identifier: MIT
# native-1 (docs/wisp/rung4.md W25), on top of prj.conf + boards/wisp_g2.conf. Built by
# scripts/build_native.sh native-1 behind the observe-only Wisp Boot.
CONFIG_WISP_HW_IMAGE=y
CONFIG_WISP_IMAGE_KIND=1

# No UART1 console (W24 fix plan 3): its pads are unverified on the G2, the case cannot see it, and
# under W24's H1b a console write that never drains is what turns a failed I2C write into a dead
# temple. Nothing logs or prints: the case UART, the boot report and the record carry what the
# app has to say.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_EARLY_CONSOLE=n
CONFIG_WISP_HEARTBEAT_MS=0

# The panel through the gated rail switches (src/drivers/npm1300_switch.c), not Zephyr's nPM13xx
# drivers: those stay off with the pmic node (G12).
CONFIG_REGULATOR=y
CONFIG_CHARGER=n
CONFIG_MFD=n
CONFIG_WISP_BOOT_SCREEN=y

# Wisp's own SoC start-up instead of the HAL's (W25: the 33 power, clock and trim writes).
CONFIG_WISP_SOC_INIT=y
