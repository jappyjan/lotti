name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    # Every project is Swift (lotti-kit, brain-eval, the iOS app): it needs macOS and Xcode 27
    # (brain-eval uses FoundationModels' `LanguageModel`, new in Xcode 27). `macos-26` stops at
    # Xcode 26.6; `xcode-27` is GitHub's macOS 27 + Xcode 27 image (preview).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # The newest Xcode on the runner.
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Wisp projects run in the Linux job below.
      - run: pnpm nx run-many -t build test --exclude='tag:wisp,wisp-*'

  wisp:
    # Wisp (firmware, core, SDK, OTA tool) builds on Linux; Nix provides CMake, the Arm
    # toolchain, west and Renode. Nothing here talks to hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # wisp-recovery's tests run under uv (pinned unicorn).
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t build test typecheck -p 'wisp-*'
      - run: pnpm nx run wisp-core:build-arm
